version: '3.8'

services:
  web:
    build: .
    restart: always
    command: ./entrypoint.sh
    volumes:
      - ./logs:/app/logs
      - ./static:/app/static
      - ./templates:/app/templates
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/app_db
      - REDIS_URL=redis://redis:6379/0
      # Add other env vars as needed, preferably from .env file
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    restart: always
    command: python worker.py
    volumes:
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/app_db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
