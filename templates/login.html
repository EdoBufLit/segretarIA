<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Login – Segreteria IA</title>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Dark Theme -->
    <link rel="stylesheet" href="/static/styles.css?v=2">
</head>

<body class="login-wrapper">

    <div class="glass-card w-full max-w-md p-8">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-400">
            Accesso Segreteria IA
        </h1>

        <div id="login-error" class="mb-4 bg-red-900/50 border border-red-500 text-red-200 px-4 py-2 rounded hidden">
            Credenziali non valide.
        </div>

        <form method="post" action="/login" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-[var(--muted)] mb-1">Username</label>
                <input name="username"
                    class="w-full border rounded p-2 text-white bg-black/20 focus:outline-none focus:border-blue-500"
                    required>
            </div>

            <div>
                <label class="block text-sm font-medium text-[var(--muted)] mb-1">Password</label>
                <input type="password" name="password"
                    class="w-full border rounded p-2 text-white bg-black/20 focus:outline-none focus:border-blue-500"
                    required>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded shadow-lg transition-all">
                Entra
            </button>
        </form>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get("error") === "1") {
            document.getElementById("login-error").classList.remove("hidden");
        }
    </script>
</body>

</html>
