{% extends "base.html" %}

{% block title %}Nuova Password - Mr.Automa{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Background Decor -->
    <div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-100/50 rounded-full blur-[100px] -z-10"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-purple-100/50 rounded-full blur-[100px] -z-10"></div>

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 sm:p-10 border border-neutral-100 fade-in">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-neutral-900 tracking-tight mb-2">Nuova Password</h1>
            <p class="text-neutral-500 text-sm">
                Imposta una nuova password per <strong>{{ email }}</strong>
            </p>
        </div>

        {% if error %}
        <div class="mb-6 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm flex items-center gap-2">
            <i data-feather="alert-circle" class="w-4 h-4"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/reset-password" class="space-y-6">
            <input type="hidden" name="token" value="{{ token }}">
            <input type="hidden" name="uid" value="{{ uid }}">

            <div>
                <label class="block text-sm font-semibold text-neutral-700 mb-2">Nuova Password</label>
                <input type="password" name="password"
                    class="w-full px-4 py-3 rounded-xl border border-neutral-200 bg-white text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-900 focus:border-transparent transition-all"
                    placeholder="Almeno 8 caratteri"
                    required minlength="8">
            </div>

            <div>
                <label class="block text-sm font-semibold text-neutral-700 mb-2">Conferma Password</label>
                <input type="password" name="password_confirm"
                    class="w-full px-4 py-3 rounded-xl border border-neutral-200 bg-white text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-900 focus:border-transparent transition-all"
                    placeholder="Ripeti la password"
                    required minlength="8">
            </div>

            <button type="submit"
                class="w-full bg-neutral-900 text-white font-semibold py-3.5 rounded-xl hover:bg-neutral-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-neutral-900 transition-all shadow-lg shadow-neutral-200/50">
                Salva Nuova Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
