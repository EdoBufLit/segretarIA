<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuova Password – Segreteria IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css?v=2">
</head>

<body class="login-wrapper">

    <div class="glass-card w-full max-w-md p-6 md:p-8">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-400">
            Imposta Nuova Password
        </h1>
        <p class="text-sm text-center text-[var(--muted)] mb-6">
            Inserisci la nuova password per l'account <strong>{{ email }}</strong>
        </p>

        {% if error %}
        <div class="mb-4 bg-red-900/50 border border-red-500 text-red-200 px-4 py-3 rounded text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/reset-password" class="space-y-6">
            <input type="hidden" name="token" value="{{ token }}">
            <input type="hidden" name="uid" value="{{ uid }}">

            <div>
                <label class="block text-sm font-medium text-[var(--muted)] mb-1">Nuova Password</label>
                <input type="password" name="password"
                    class="w-full border rounded p-2 text-white bg-black/20 focus:outline-none focus:border-blue-500"
                    required minlength="8">
            </div>

            <div>
                <label class="block text-sm font-medium text-[var(--muted)] mb-1">Conferma Password</label>
                <input type="password" name="password_confirm"
                    class="w-full border rounded p-2 text-white bg-black/20 focus:outline-none focus:border-blue-500"
                    required minlength="8">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded shadow-lg transition-all">
                Salva Nuova Password
            </button>
        </form>
    </div>

</body>
</html>
