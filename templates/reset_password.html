{% extends "base.html" %}

{% block title %}Nuova Password - Mr.Automa{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-16 ui-ambient">
    <div class="ui-card w-full max-w-md p-8 md:p-10">
        <div class="mb-8 text-center">
            <h1 class="font-display text-3xl text-neutral-900">Nuova password</h1>
            <p class="text-neutral-500 text-sm mt-2">Imposta una nuova password per <strong>{{ email }}</strong></p>
        </div>

        {% if error %}
        <div class="mb-6 ui-card-soft px-4 py-3 text-sm text-red-600 border border-red-200">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/reset-password" class="space-y-6">
            <input type="hidden" name="token" value="{{ token }}">
            <input type="hidden" name="uid" value="{{ uid }}">

            <div>
                <label class="block text-sm font-semibold text-neutral-700 mb-2">Nuova Password</label>
                <input type="password" name="password" class="ui-input" placeholder="Almeno 8 caratteri" required minlength="8">
            </div>

            <div>
                <label class="block text-sm font-semibold text-neutral-700 mb-2">Conferma Password</label>
                <input type="password" name="password_confirm" class="ui-input" placeholder="Ripeti la password" required minlength="8">
            </div>

            <button type="submit" class="ui-button ui-button-primary w-full py-3 text-sm">Salva nuova password</button>
        </form>
    </div>
</div>
{% endblock %}
