<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recupera Password – Segreteria IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css?v=2">
</head>

<body class="login-wrapper">

    <div class="glass-card w-full max-w-md p-6 md:p-8">
        <div class="mb-6 flex justify-start">
            <a href="/login" aria-label="Torna al login"
                class="inline-flex items-center gap-2 text-sm text-blue-300 hover:text-blue-200 font-semibold focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-2 focus-visible:ring-offset-black/40 rounded">
                <span aria-hidden="true">←</span>
                Torna al login
            </a>
        </div>
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-400">
            Recupera Password
        </h1>

        {% if message %}
        <div class="mb-4 bg-blue-900/40 border border-blue-500 text-blue-200 px-4 py-3 rounded text-sm">
            {{ message }}
        </div>
        {% endif %}

        {% if error %}
        <div class="mb-4 bg-red-900/50 border border-red-500 text-red-200 px-4 py-3 rounded text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/forgot-password" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-[var(--muted)] mb-1">Email</label>
                <input type="email" name="email"
                    class="w-full border rounded p-2 text-white bg-black/20 focus:outline-none focus:border-blue-500"
                    placeholder="La tua email di registrazione" required>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded shadow-lg transition-all">
                Invia link di reset
            </button>
        </form>
    </div>

</body>
</html>
