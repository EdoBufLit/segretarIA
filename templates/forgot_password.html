{% extends "base.html" %}

{% block title %}Recupera Password - Mr.Automa{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-16 ui-ambient">
    <div class="ui-card w-full max-w-md p-8 md:p-10">
        <div class="mb-6">
            <a href="/login" class="inline-flex items-center gap-2 text-sm text-neutral-500 hover:text-neutral-900 transition-colors mb-6">
                <i data-feather="arrow-left" class="w-4 h-4"></i>
                Torna al login
            </a>
            <h1 class="font-display text-3xl text-neutral-900">Recupera password</h1>
            <p class="text-neutral-500 mt-2">Inserisci la tua email per ricevere un link di reset.</p>
        </div>

        {% if message %}
        <div class="mb-6 ui-card-soft px-4 py-3 text-sm text-emerald-700 border border-emerald-200">
            {{ message }}
        </div>
        {% endif %}

        {% if error %}
        <div class="mb-6 ui-card-soft px-4 py-3 text-sm text-red-600 border border-red-200">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/forgot-password" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-neutral-700 mb-2">Email</label>
                <input type="email" name="email" class="ui-input" placeholder="La tua email di registrazione" required>
            </div>

            <button type="submit" class="ui-button ui-button-primary w-full py-3 text-sm">Invia link di reset</button>
        </form>
    </div>
</div>
{% endblock %}
