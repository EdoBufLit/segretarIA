{% extends "base.html" %}

{% block title %}Recupera Password - Mr.Automa{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Background Decor -->
    <div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-100/50 rounded-full blur-[100px] -z-10"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-100/50 rounded-full blur-[100px] -z-10"></div>

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 sm:p-10 border border-neutral-100 fade-in">
        <div class="mb-6">
            <a href="/login" class="inline-flex items-center gap-2 text-sm text-neutral-500 hover:text-neutral-900 transition-colors mb-6 group">
                <i data-feather="arrow-left" class="w-4 h-4 transition-transform group-hover:-translate-x-1"></i>
                Torna al login
            </a>
            <h1 class="text-3xl font-bold text-neutral-900 tracking-tight mb-2">Recupera Password</h1>
            <p class="text-neutral-500">Inserisci la tua email per ricevere un link di reset.</p>
        </div>

        {% if message %}
        <div class="mb-6 bg-blue-50 border border-blue-200 text-blue-700 px-4 py-3 rounded-xl text-sm flex items-center gap-2">
            <i data-feather="info" class="w-4 h-4"></i>
            {{ message }}
        </div>
        {% endif %}

        {% if error %}
        <div class="mb-6 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm flex items-center gap-2">
            <i data-feather="alert-circle" class="w-4 h-4"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/forgot-password" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-neutral-700 mb-2">Email</label>
                <input type="email" name="email"
                    class="w-full px-4 py-3 rounded-xl border border-neutral-200 bg-white text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-900 focus:border-transparent transition-all"
                    placeholder="La tua email di registrazione"
                    required>
            </div>

            <button type="submit"
                class="w-full bg-neutral-900 text-white font-semibold py-3.5 rounded-xl hover:bg-neutral-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-neutral-900 transition-all shadow-lg shadow-neutral-200/50">
                Invia link di reset
            </button>
        </form>
    </div>
</div>
{% endblock %}
